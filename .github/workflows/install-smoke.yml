# Installs every Windows and Linux package of a KafDesk release on a clean
# machine, starts the app, talks to kafdesk-mcp and uninstalls again.
# Runs on each published release and by hand (Actions → Install smoke test).
name: Install smoke test

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, e.g. v0.2.1 (empty: the latest release)"
        required: false
      from:
        description: "Self-update test: the version to update from (empty: the release before)"
        required: false

permissions:
  contents: read

concurrency:
  group: install-smoke-${{ github.event.release.tag_name || inputs.version || 'latest' }}
  cancel-in-progress: true

env:
  TAG: ${{ github.event.release.tag_name || inputs.version }}
  FROM: ${{ inputs.from }}
  GH_TOKEN: ${{ github.token }}

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-latest }
          - { arch: arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: .github/smoke }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Download the installer and check its checksum
        shell: bash
        run: |
          tag="${TAG:-$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName)}"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -p "KafDesk-*-${{ matrix.arch }}-setup.exe" -p SHA256SUMS -D dl
          cd dl && grep -- "-${{ matrix.arch }}-setup.exe" SHA256SUMS | sha256sum -c -
      - name: Silent install
        shell: pwsh
        run: |
          $setup = Get-ChildItem dl\KafDesk-*-setup.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          $exe = Get-ChildItem -Recurse -Filter KafDesk.exe -Path "$env:ProgramFiles\AKStudio","$env:LOCALAPPDATA\Programs\KafDesk" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "KafDesk.exe not found after install" }
          $dir = $exe.DirectoryName
          Get-ChildItem $dir | Format-Table Name, Length
          foreach ($f in 'KafDesk.exe','kafdesk-mcp.exe','uninstall.exe') { if (-not (Test-Path "$dir\$f")) { throw "$f missing" } }
          $lnk = Get-ChildItem "$env:ProgramData\Microsoft\Windows\Start Menu\Programs","$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Filter 'KafDesk.lnk' -ErrorAction SilentlyContinue
          if (-not $lnk) { throw "Start menu shortcut missing" }
          $arch = (Get-Item "$dir\KafDesk.exe").VersionInfo
          "version: $($arch.ProductVersion)"
          "KDDIR=$dir" | Out-File -Append $env:GITHUB_ENV
      - name: kafdesk-mcp answers over stdio
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\kdapp" | Out-Null
          python .github/smoke/mcp-check.py "$env:KDDIR\kafdesk-mcp.exe" "$env:RUNNER_TEMP\kdapp"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: The app starts and keeps running
        shell: pwsh
        run: |
          $p = Start-Process "$env:KDDIR\KafDesk.exe" -PassThru
          Start-Sleep 20
          if ($p.HasExited) { throw "KafDesk exited with code $($p.ExitCode)" }
          $p.Refresh()
          "window: '$($p.MainWindowTitle)', memory: $([math]::Round($p.WorkingSet64/1MB)) MB"
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$env:RUNNER_TEMP\kafdesk-windows-${{ matrix.arch }}.png")
          Stop-Process -Id $p.Id -Force
          Start-Sleep 3
      - name: Silent uninstall
        shell: pwsh
        run: |
          Get-Process KafDesk -ErrorAction SilentlyContinue | Stop-Process -Force
          $p = Start-Process "$env:KDDIR\uninstall.exe" -ArgumentList '/S' -Wait -PassThru
          Start-Sleep 5  # the NSIS uninstaller re-launches itself from %TEMP%
          if (Test-Path "$env:KDDIR\KafDesk.exe") { throw "KafDesk.exe still present after uninstall" }
          "uninstalled"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-windows-${{ matrix.arch }}
          path: ${{ runner.temp }}/kafdesk-windows-${{ matrix.arch }}.png
          if-no-files-found: ignore

  linux:
    name: Linux ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub's Ubuntu machines are real VMs with Ubuntu's AppArmor
          # rules, so the package runs there as on a desktop.
          - { name: deb amd64 (Ubuntu 24.04), runner: ubuntu-24.04, image: "", pkg: "kafdesk_*_amd64.deb" }
          - { name: deb arm64 (Ubuntu 24.04), runner: ubuntu-24.04-arm, image: "", pkg: "kafdesk_*_arm64.deb" }
          # Other distributions in a container that allows the user
          # namespaces WebKit's sandbox (bubblewrap) needs.
          - { name: deb amd64 (Debian 13), runner: ubuntu-24.04, image: "debian:13", pkg: "kafdesk_*_amd64.deb" }
          - { name: rpm x86_64 (Fedora 42), runner: ubuntu-24.04, image: "fedora:42", pkg: "kafdesk-*.x86_64.rpm" }
          - { name: rpm aarch64 (Fedora 42), runner: ubuntu-24.04-arm, image: "fedora:42", pkg: "kafdesk-*.aarch64.rpm" }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: .github/smoke }
      - name: Download the package and check its checksum
        run: |
          tag="${TAG:-$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName)}"
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -p "${{ matrix.pkg }}" -p SHA256SUMS -D dl
          cd dl && f=$(ls ${{ matrix.pkg }}) && grep " $f\$" SHA256SUMS | sha256sum -c -
          echo "PKG=dl/$f" >> "$GITHUB_ENV"
      - name: Install, start, talk to kafdesk-mcp, remove (this machine)
        if: matrix.image == ''
        run: |
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          bash .github/smoke/linux.sh "$PKG"
      - name: Install, start, talk to kafdesk-mcp, remove (clean ${{ matrix.image }})
        if: matrix.image != ''
        run: |
          # The container shares this Ubuntu kernel; Debian and Fedora
          # kernels do not restrict unprivileged user namespaces.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          docker run --rm --privileged \
            -v "$PWD:/w" -w /w ${{ matrix.image }} bash .github/smoke/linux.sh "$PKG"

  # The previous release updates itself to this one the way a user does it:
  # settings allow the daily check, KafDesk finds the version on
  # kafdesk.com/release.txt, the driver clicks "Install update", and the new
  # version must be installed in place and running again. Copies before
  # 0.2.5 cannot install updates; then the job only checks that this
  # release detects its install method (probe).
  update:
    name: Self-update ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, runner: windows-latest, os: windows, arch: x64 }
          - { name: Windows arm64, runner: windows-11-arm, os: windows, arch: arm64 }
          - { name: Ubuntu amd64, runner: ubuntu-24.04, os: linux, arch: amd64 }
          - { name: Ubuntu arm64, runner: ubuntu-24.04-arm, os: linux, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: .github/smoke }
      - uses: actions/setup-python@v5
        if: matrix.os == 'windows'
        with: { python-version: "3.12" }
      - name: Pick the versions
        shell: bash
        run: |
          new="${TAG:-$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName)}"
          from="$FROM"
          if [ -z "$from" ]; then
            from=$(gh release list -R "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 50 \
              --json tagName -q '.[].tagName' | sort -V | awk -v n="$new" '$0 == n { print p; exit } { p = $0 }')
          fi
          mode=install
          if [ -z "$from" ] || [ "$(printf '%s\n' v0.2.5 "$from" | sort -V | head -1)" != v0.2.5 ]; then
            echo "::notice::$from cannot install updates itself; probing $new instead"
            mode=probe from=$new
          fi
          echo "NEW=$new" >> "$GITHUB_ENV"
          echo "FROM_TAG=$from" >> "$GITHUB_ENV"
          echo "MODE=$mode" >> "$GITHUB_ENV"
          echo "$mode: $from -> $new"
      - name: Download the package to start from
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = windows ]; then pat="KafDesk-*-${{ matrix.arch }}-setup.exe"; else pat="kafdesk_*_${{ matrix.arch }}.deb"; fi
          gh release download "$FROM_TAG" -R "$GITHUB_REPOSITORY" -p "$pat" -p SHA256SUMS -D old
          cd old && f=$(ls $pat) && grep " $f\$" SHA256SUMS | sha256sum -c -
          path="$PWD/$f"
          [ "${{ matrix.os }}" = windows ] && path=$(cygpath -w "$path")
          echo "OLD_PKG=$path" >> "$GITHUB_ENV"
      - name: Wait until kafdesk.com offers the new version
        if: env.MODE == 'install'
        shell: bash
        run: |
          want=${NEW#v}
          for i in $(seq 1 80); do
            got=$(curl -fsS "https://kafdesk.com/release.txt?smoke=$GITHUB_RUN_ID-$i" | tr -d '[:space:]' || true)
            [ "$got" = "$want" ] && { echo "release.txt: $got"; exit 0; }
            echo "release.txt: '$got', waiting for $want"; sleep 15
          done
          exit 1
      - name: Update like a user (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          python -m pip install -q websocket-client uiautomation
          & .github/smoke/update-windows.ps1 -Mode $env:MODE -Setup $env:OLD_PKG -Want $env:NEW.TrimStart('v')
      - name: Update like a user (Ubuntu)
        if: matrix.os == 'linux'
        run: bash .github/smoke/update-linux.sh "$MODE" "$OLD_PKG" "${NEW#v}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: update-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/kafdesk-updated.png
            /tmp/kafdesk-updated.png
            /tmp/kafdesk.log
          if-no-files-found: ignore
