# Installs every Windows and Linux package of a KafDesk release on a clean
# machine, starts the app, talks to kafdesk-mcp and uninstalls again.
# Runs on each published release and by hand (Actions → Install smoke test).
name: Install smoke test

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, e.g. v0.2.1 (empty: the latest release)"
        required: false

permissions:
  contents: read

concurrency:
  group: install-smoke-${{ github.event.release.tag_name || inputs.version || 'latest' }}
  cancel-in-progress: true

env:
  TAG: ${{ github.event.release.tag_name || inputs.version }}
  GH_TOKEN: ${{ github.token }}

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-latest }
          - { arch: arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: .github/smoke }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Download the installer and check its checksum
        shell: bash
        run: |
          tag="${TAG:-$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName)}"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -p "KafDesk-*-${{ matrix.arch }}-setup.exe" -p SHA256SUMS -D dl
          cd dl && grep -- "-${{ matrix.arch }}-setup.exe" SHA256SUMS | sha256sum -c -
      - name: Silent install
        shell: pwsh
        run: |
          $setup = Get-ChildItem dl\KafDesk-*-setup.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          $exe = Get-ChildItem -Recurse -Filter KafDesk.exe -Path "$env:ProgramFiles\AKStudio","$env:LOCALAPPDATA\Programs\KafDesk" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "KafDesk.exe not found after install" }
          $dir = $exe.DirectoryName
          Get-ChildItem $dir | Format-Table Name, Length
          foreach ($f in 'KafDesk.exe','kafdesk-mcp.exe','uninstall.exe') { if (-not (Test-Path "$dir\$f")) { throw "$f missing" } }
          $lnk = Get-ChildItem "$env:ProgramData\Microsoft\Windows\Start Menu\Programs","$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Filter 'KafDesk.lnk' -ErrorAction SilentlyContinue
          if (-not $lnk) { throw "Start menu shortcut missing" }
          $arch = (Get-Item "$dir\KafDesk.exe").VersionInfo
          "version: $($arch.ProductVersion)"
          "KDDIR=$dir" | Out-File -Append $env:GITHUB_ENV
      - name: kafdesk-mcp answers over stdio
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\kdapp" | Out-Null
          python .github/smoke/mcp-check.py "$env:KDDIR\kafdesk-mcp.exe" "$env:RUNNER_TEMP\kdapp"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: The app starts and keeps running
        shell: pwsh
        run: |
          $p = Start-Process "$env:KDDIR\KafDesk.exe" -PassThru
          Start-Sleep 20
          if ($p.HasExited) { throw "KafDesk exited with code $($p.ExitCode)" }
          $p.Refresh()
          "window: '$($p.MainWindowTitle)', memory: $([math]::Round($p.WorkingSet64/1MB)) MB"
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$env:RUNNER_TEMP\kafdesk-windows-${{ matrix.arch }}.png")
          Stop-Process -Id $p.Id -Force
          Start-Sleep 3
      - name: Silent uninstall
        shell: pwsh
        run: |
          Get-Process KafDesk -ErrorAction SilentlyContinue | Stop-Process -Force
          $p = Start-Process "$env:KDDIR\uninstall.exe" -ArgumentList '/S' -Wait -PassThru
          Start-Sleep 5  # the NSIS uninstaller re-launches itself from %TEMP%
          if (Test-Path "$env:KDDIR\KafDesk.exe") { throw "KafDesk.exe still present after uninstall" }
          "uninstalled"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-windows-${{ matrix.arch }}
          path: ${{ runner.temp }}/kafdesk-windows-${{ matrix.arch }}.png
          if-no-files-found: ignore

  linux:
    name: Linux ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub's Ubuntu machines are real VMs with Ubuntu's AppArmor
          # rules, so the package runs there as on a desktop.
          - { name: deb amd64 (Ubuntu 24.04), runner: ubuntu-24.04, image: "", pkg: "kafdesk_*_amd64.deb" }
          - { name: deb arm64 (Ubuntu 24.04), runner: ubuntu-24.04-arm, image: "", pkg: "kafdesk_*_arm64.deb" }
          # Other distributions in a container that allows the user
          # namespaces WebKit's sandbox (bubblewrap) needs.
          - { name: deb amd64 (Debian 13), runner: ubuntu-24.04, image: "debian:13", pkg: "kafdesk_*_amd64.deb" }
          - { name: rpm x86_64 (Fedora 42), runner: ubuntu-24.04, image: "fedora:42", pkg: "kafdesk-*.x86_64.rpm" }
          - { name: rpm aarch64 (Fedora 42), runner: ubuntu-24.04-arm, image: "fedora:42", pkg: "kafdesk-*.aarch64.rpm" }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: .github/smoke }
      - name: Download the package and check its checksum
        run: |
          tag="${TAG:-$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName)}"
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -p "${{ matrix.pkg }}" -p SHA256SUMS -D dl
          cd dl && f=$(ls ${{ matrix.pkg }}) && grep " $f\$" SHA256SUMS | sha256sum -c -
          echo "PKG=dl/$f" >> "$GITHUB_ENV"
      - name: Install, start, talk to kafdesk-mcp, remove (this machine)
        if: matrix.image == ''
        run: |
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          bash .github/smoke/linux.sh "$PKG"
      - name: Install, start, talk to kafdesk-mcp, remove (clean ${{ matrix.image }})
        if: matrix.image != ''
        run: |
          docker run --rm --privileged \
            -v "$PWD:/w" -w /w ${{ matrix.image }} bash .github/smoke/linux.sh "$PKG"
